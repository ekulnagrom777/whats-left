<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx="70%" cy="-10%" r="90%">
      <stop offset="0%" stop-color="#1c1a26"/>
      <stop offset="60%" stop-color="#101016"/>
    </radialGradient>
    <radialGradient id="leftdot" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fffbef"/>
      <stop offset="38%" stop-color="#f2eee2"/>
      <stop offset="60%" stop-color="#f2eee2" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#f2eee2" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nowdot" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff3d0"/>
      <stop offset="40%" stop-color="#e8b94f"/>
      <stop offset="65%" stop-color="#e8b94f" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#e8b94f" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- dot field: spent (grey) then one gold "today", then bright remaining -->
  <g id="dots"></g>

  <text x="80" y="170" font-family="Georgia, serif" font-size="64" fill="#f2eee2">The average life is</text>
  <text x="80" y="250" font-family="Georgia, serif" font-size="64" fill="#f2eee2">4,680 Saturdays.</text>
  <text x="80" y="345" font-family="Georgia, serif" font-size="64" font-style="italic" fill="#e8b94f">How many do you</text>
  <text x="80" y="425" font-family="Georgia, serif" font-size="64" font-style="italic" fill="#e8b94f">have left?</text>

  <text x="80" y="560" font-family="Georgia, serif" font-size="30" fill="#9b9588">whatsleft.pages.dev · it's just dots</text>
</svg>
